<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>같이놀자 청모 QUIZ</title>
<style>:root{--p:#e88fa5;--bg:#fff9f6;--line:#eadbd7}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#3b3432}.wrap{max-width:920px;margin:auto;padding:16px}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:0 8px 30px #0001}.hidden{display:none}.center{text-align:center}.btn{border:0;border-radius:14px;padding:13px 18px;background:var(--p);color:#fff;font-weight:800;cursor:pointer}.gray{background:#eee6e3;color:#554c49}input{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;margin:8px 0 14px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ans{padding:18px;border:2px solid var(--line);border-radius:16px;background:#fff;font-weight:800;cursor:pointer}.sel{border-color:var(--p);background:#fff0f4}.top{display:flex;justify-content:space-between;gap:10px}.badge,.pill{display:inline-block;padding:7px 11px;border-radius:99px;background:#fff0f4;color:#b55370;font-weight:800}.pill{background:#f3eeec;color:#554c49;margin:3px}.big{font-size:54px}.detail{background:#fff5f2;border-radius:14px;padding:14px;margin-top:14px}.row{padding:9px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:600px){.answers,.grid{grid-template-columns:1fr}.card{padding:20px}}</style></head><body><div class="wrap">
<section id="home" class="card center"><div class="big">💕</div><h1>지원 ♥ 지현<br>같이놀자 청모 QUIZ</h1><p>신랑신부 QUIZ 5문제 + 같이놀자 AWARDS 5문제</p><button class="btn" onclick="show('join')">참여하기</button> <button class="btn gray" onclick="show('login')">진행자</button></section>
<section id="join" class="card hidden"><h2>👋 이름을 입력해주세요</h2><input id="name" maxlength="12" placeholder="예: 소희"><button class="btn" onclick="join()">입장하기</button></section>
<section id="wait" class="card center hidden"><div class="big">💍</div><h2 id="wel"></h2><p>진행자가 시작하면 모두 같은 문제로 이동합니다.</p><span class="badge">대기 중</span></section>
<section id="quiz" class="card hidden"><div class="top"><span id="qn" class="badge"></span><span id="sc" class="badge"></span></div><h2 id="qt"></h2><div id="ans" class="answers"></div><p id="msg" class="center"></p><div id="detail" class="detail hidden"></div></section>
<section id="awards" class="card hidden"><span class="badge">💕 같이놀자 AWARDS</span><div class="top"><h2 id="aqt"></h2><span id="an" class="badge"></span></div><div id="ava" class="answers"></div><p id="am" class="center"></p></section>
<section id="final" class="card center hidden"><div class="big">🏆</div><h1>같이놀자 AWARDS</h1><div id="fr"></div><hr><h2>신랑신부 QUIZ 최종 순위</h2><div id="rank"></div></section>
<section id="login" class="card hidden"><h2>🎤 진행자 입장</h2><input id="pw" type="password" placeholder="관리자 비밀번호"><button class="btn" onclick="admin()">입장</button></section>
<section id="admin" class="card hidden"><div class="top"><h2>🎤 진행자 화면</h2><button class="btn gray" onclick="reset()">초기화</button></div><span id="ast" class="badge"></span><h2 id="adminQ"></h2><div id="ad"></div><div class="grid"><div><h3>참여자 (<span id="pc">0</span>)</h3><div id="players"></div></div><div><h3>현재 응답</h3><div id="responses"></div><h3>점수</h3><div id="scores"></div></div></div><div style="margin-top:20px;display:flex;gap:10px;flex-wrap:wrap"><button id="start" class="btn" onclick="go('/api/admin/start','POST')">게임 시작</button><button id="rev" class="btn" onclick="go('/api/admin/reveal','POST')" disabled>정답 공개</button><button id="next" class="btn" onclick="go('/api/admin/next','POST')" disabled>다음 문제</button><button id="anext" class="btn" onclick="go('/api/admin/award-next','POST')" disabled>다음 어워즈</button><button class="btn gray" onclick="finalAdmin()">최종 결과</button></div><h3>AWARDS 결과</h3><div id="ar"></div></section>
</div><script>
let me=localStorage.getItem("cm_name")||"",qs=[],aws=[];const $=x=>document.getElementById(x);function show(x){document.querySelectorAll("section").forEach(s=>s.classList.add("hidden"));$(x).classList.remove("hidden")}
async function api(u,m="GET",b){let r=await fetch(u,{method:m,headers:{"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined});let j=await r.json();if(!r.ok)throw Error(j.error||"오류");return j}
async function init(){let j=await api("/api/questions");qs=j.questions;aws=j.awards}async function join(){let n=$("name").value.trim();if(!n)return alert("이름을 입력해주세요.");await api("/api/join","POST",{name:n});me=n;localStorage.setItem("cm_name",n);$("wel").textContent=n+"님, 입장 완료!";show("wait")}
function admin(){if($("pw").value==="1234")show("admin");else alert("비밀번호가 맞지 않습니다.")}
async function answer(i){try{await api("/api/answer","POST",{name:me,answer:i})}catch(e){alert(e.message)}}
async function award(n){try{await api("/api/award","POST",{voter:me,selected:n});$("am").textContent="투표 완료!"}catch(e){alert(e.message)}}
async function go(u,m){try{await api(u,m)}catch(e){alert(e.message)}}
function player(s){if(!me)return;if(s.phase==="lobby"){show("wait");return}if(s.phase==="quiz"){show("quiz");let q=qs[s.q],p=s.players[me];$("qn").textContent=`${s.q+1} / ${qs.length}`;$("sc").textContent=(p?.score||0)+"점";$("qt").textContent=q.text;$("ans").innerHTML=q.answers.map((a,i)=>`<button class="ans ${p?.answered?"sel":""}" ${p?.answered||s.reveal?"disabled":""} onclick="answer(${i})">${["①","②","③","④"][i]} ${a}</button>`).join("");$("msg").textContent=s.reveal?"정답 공개!":p?.answered?"답변 완료!":"선택해주세요.";if(s.reveal){$("detail").classList.remove("hidden");$("detail").innerHTML="<b>정답</b> · "+q.answers[q.correct]+"<br>"+q.detail}else $("detail").classList.add("hidden")}else if(s.phase==="awards"){show("awards");let i=s.award_q;$("aqt").textContent=aws[i];$("an").textContent=`${i+1} / ${aws.length}`;$("ava").innerHTML=Object.keys(s.players).map(n=>`<button class="ans" onclick='award(${JSON.stringify(n)})'>${n}</button>`).join("")}else final(s)}
function adminRender(s){$("ast").textContent=s.phase;$("pc").textContent=Object.keys(s.players).length;$("players").innerHTML=Object.keys(s.players).map(n=>`<span class="pill">${n}</span>`).join("")||"없음";$("responses").innerHTML=Object.entries(s.players).filter(([n,p])=>p.answered).map(([n])=>`<span class="pill">${n} ✓</span>`).join("")||"아직 없음";$("scores").innerHTML=Object.entries(s.players).sort((a,b)=>b[1].score-a[1].score).map(([n,p],i)=>`<div class="row"><span>${i+1}. ${n}</span><b>${p.score}점</b></div>`).join("");$("start").disabled=s.phase!=="lobby";$("rev").disabled=!(s.phase==="quiz"&&!s.reveal);$("next").disabled=!(s.phase==="quiz"&&s.reveal);$("anext").disabled=s.phase!=="awards";if(s.phase==="quiz"){$("adminQ").textContent=qs[s.q].text;$("ad").innerHTML=s.reveal?`<div class="detail"><b>정답: ${qs[s.q].answers[qs[s.q].correct]}</b><br>${qs[s.q].detail}</div>`:""}else if(s.phase==="awards"){$("adminQ").textContent="💕 "+aws[s.award_q];$("ad").textContent="참가자들이 동시에 투표 중입니다."}else{$("adminQ").textContent=s.phase==="final"?"최종 결과":"게임 시작 전";$("ad").textContent=""}}
async function finalAdmin(){let s=await api("/api/state"),r=await api("/api/admin/award-results");finalHTML(s,r)}
function finalHTML(s,r){let arr=Object.entries(s.players).sort((a,b)=>b[1].score-a[1].score);$("fr").innerHTML=r.results.map((c,i)=>{let a=Object.entries(c).sort((x,y)=>y[1]-x[1])[0];return a?`<p>Q${i+1} · 🏆 ${a[0]} (${a[1]}표)</p>`:""}).join("");$("rank").innerHTML=arr.map((x,i)=>`<h2>${["🥇","🥈","🥉"][i]||"🏅"} ${x[0]} — ${x[1].score}점</h2>`).join("");show("final")}
async function poll(){try{let s=await api("/api/state");if(!$("admin").classList.contains("hidden"))adminRender(s);else player(s)}catch(e){}}init();setInterval(poll,700)
</script></body></html>
