<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>지지커플 QUIZ · 지현지원 청모 AWARDS</title>
<style>
:root{--p:#e88fa5;--bg:#fff9f6;--line:#eadbd7;--dark:#3b3432;--green:#4b9567;--yellow:#b77b25;--red:#a85b68}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--dark)}
.wrap{max-width:980px;margin:auto;padding:16px}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:0 8px 30px #0001}.hidden{display:none}.center{text-align:center}
.btn{border:0;border-radius:14px;padding:12px 17px;background:var(--p);color:#fff;font-weight:800;cursor:pointer}.btn.gray{background:#eee6e3;color:#554c49}.btn.green{background:#6aa57f}.btn:disabled{opacity:.45;cursor:not-allowed}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;margin:6px 0 12px;font:inherit}textarea{min-height:70px;resize:vertical}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ans{padding:17px;border:2px solid var(--line);border-radius:16px;background:#fff;font-weight:800;cursor:pointer}.ans.sel{border-color:var(--p);background:#fff0f4}
.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.badge,.pill{display:inline-block;padding:7px 11px;border-radius:99px;background:#fff0f4;color:#b55370;font-weight:800}.pill{background:#f3eeec;color:#554c49;margin:3px}.big{font-size:54px}
.detail{background:#fff5f2;border-radius:14px;padding:14px;margin-top:14px}.row{padding:9px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.monitor{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}.person{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}.ok{color:var(--green)}.waitc{color:var(--yellow)}.off{color:var(--red)}
.preview{background:#fffaf8;border:2px dashed var(--line);border-radius:18px;padding:18px;margin:16px 0}.preview .pvq{font-weight:800;font-size:18px;margin:10px 0}.preview .pva{display:grid;grid-template-columns:1fr 1fr;gap:8px}.preview .pva span{border:1px solid var(--line);border-radius:10px;padding:9px;background:#fff}
.notice{background:#fff5f2;border-radius:12px;padding:11px;margin:10px 0;font-size:14px}.resultbox{background:#fff7f3;border-radius:18px;padding:18px;text-align:center}.winner{font-size:28px;font-weight:900;margin:8px 0}.bar{height:9px;background:#eee1dc;border-radius:99px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:var(--p)}
@media(max-width:600px){.answers,.grid,.monitor{grid-template-columns:1fr}.card{padding:20px}.answer-row{grid-template-columns:35px 1fr 62px}}
.final-title{font-size:1.5em;margin:18px 0 12px}</style></head><body><div class="wrap">

<section id="home" class="card center"><div class="big">💕</div><h1>지원 ♥ 지현<br>같이놀자 청모 QUIZ</h1><p>지지커플 QUIZ + 지현지원 청모 AWARDS</p>
<button class="btn" onclick="show('join')">참여하기</button> <button class="btn gray" onclick="show('login')">진행자</button></section>

<section id="join" class="card hidden"><h2>👋 이름을 입력해주세요</h2><input id="name" maxlength="12" placeholder="예: 김지현"><button class="btn" onclick="join()">입장하기</button></section>
<section id="wait" class="card center hidden"><div class="big">💍</div><h2 id="wel"></h2><p>진행자가 시작하면 모두 같은 문제로 이동합니다.</p><span class="badge">대기 중</span><br><br><button class="btn gray" onclick="home()">처음 화면으로</button></section>

<section id="quiz" class="card hidden"><div class="top"><span id="qn" class="badge"></span><span id="sc" class="badge"></span></div><h2 id="qt"></h2><div id="ans" class="answers"></div><p id="msg" class="center"></p><div id="detail" class="detail hidden"></div></section>

<section id="awards" class="card hidden"><span class="badge">💕 지현지원 청모 AWARDS</span><div class="top"><h2 id="aqt"></h2><span id="an" class="badge"></span></div><div id="ava" class="answers"></div><p id="am" class="center"></p><div id="awardPlayerResult" class="resultbox hidden"></div></section>

<section id="final" class="card center hidden"><div class="big">🏆</div>
<h2 class="final-title">지지커플 QUIZ 최종 순위</h2><div id="rank"></div>
<hr><h2 class="final-title">지현지원 청모 AWARDS</h2><div id="fr"></div></section>

<section id="login" class="card hidden"><h2>🎤 진행자 입장</h2><input id="pw" type="password" placeholder="관리자 비밀번호"><button class="btn" onclick="admin()">입장</button></section>

<section id="admin" class="card hidden">
<div class="top"><h2>🎤 진행자 화면</h2><button class="btn gray" onclick="reset()">초기화</button></div>
<span id="ast" class="badge"></span><h2 id="adminQ"></h2><div id="ad"></div>
<div id="preview" class="preview"></div>
<div class="top"><h3>👀 참가자 실시간 현황</h3><span id="liveCount" class="badge"></span></div><div id="monitor" class="monitor"></div>
<div class="grid"><div><h3>참여자 (<span id="pc">0</span>)</h3><div id="players"></div></div><div><h3>현재 응답</h3><div id="responses"></div><h3>점수</h3><div id="scores"></div></div></div>
<div style="margin-top:20px;display:flex;gap:10px;flex-wrap:wrap">
<button id="start" class="btn" onclick="go('/api/admin/start','POST')">게임 시작</button>
<button id="rev" class="btn" onclick="go('/api/admin/reveal','POST')" disabled>정답 공개</button>
<button id="next" class="btn" onclick="go('/api/admin/next','POST')" disabled>다음 문제</button>
<button id="arev" class="btn green" onclick="go('/api/admin/award-reveal','POST')" disabled>AWARDS 결과 공개</button>
<button id="anext" class="btn" onclick="go('/api/admin/award-next','POST')" disabled>다음 어워즈</button>
<button class="btn gray" onclick="finalAdmin()">최종 결과</button>
</div>
<h3>💕 현재 AWARDS 결과</h3><div id="ar"></div>

</section>
</div>

<script>
let me="",qs=[],aws=[],lastAwardIndex=-1;
const $=x=>document.getElementById(x);
function show(x){document.querySelectorAll("section").forEach(s=>s.classList.add("hidden"));$(x).classList.remove("hidden")}
async function api(u,m="GET",b){let r=await fetch(u,{method:m,headers:{"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined});let j=await r.json();if(!r.ok)throw Error(j.error||"오류");return j}
async function init(){let j=await api("/api/questions");qs=j.questions;aws=j.awards}
async function join(){let n=$("name").value.trim();if(!n)return alert("이름을 입력해주세요.");try{await api("/api/join","POST",{name:n});me=n;$("wel").textContent=n+"님, 입장 완료!";show("wait")}catch(e){alert(e.message)}}
function admin(){if($("pw").value==="1234"){show("admin")}else alert("비밀번호가 맞지 않습니다.")}
async function answer(i){try{await api("/api/answer","POST",{name:me,answer:i})}catch(e){alert(e.message)}}
async function award(n){try{await api("/api/award","POST",{voter:me,selected:n});/* 상태는 다음 실시간 state에서 갱신 */}catch(e){alert(e.message)}}
async function go(u,m){try{await api(u,m)}catch(e){alert(e.message)}}

function player(s){
 if(!me)return;
 if(s.phase==="lobby"){lastAwardIndex=-1;show("wait");return}
 if(s.phase==="quiz"){lastAwardIndex=-1;
  show("quiz");let q=qs[s.q],p=s.players[me];$("qn").textContent=`${s.q+1} / ${qs.length}`;$("sc").textContent=(p?.score||0)+"점";$("qt").textContent=q.text;
  $("ans").innerHTML=q.answers.map((a,i)=>`<button class="ans ${p?.answer===i?"sel":""}" ${p?.answered||s.reveal?"disabled":""} onclick="answer(${i})">${["①","②","③","④"][i]} ${a}</button>`).join("");
  $("msg").textContent=s.reveal?"정답 공개!":p?.answered?"답변 완료!":"선택해주세요.";
  if(s.reveal){$("detail").classList.remove("hidden");$("detail").innerHTML="<b>정답</b> · "+q.answers[q.correct]+"<br>"+q.detail}else $("detail").classList.add("hidden");
 }else if(s.phase==="awards"){
  show("awards");let i=s.award_q;
  if(lastAwardIndex!==i){
    lastAwardIndex=i;
    $("am").textContent="";
    $("awardPlayerResult").classList.add("hidden");
    $("ava").innerHTML="";
  }
  $("aqt").textContent=aws[i];$("an").textContent=`${i+1} / ${aws.length}`;
  const myKey=`${i}|${me}`, voted=Object.prototype.hasOwnProperty.call(s.votes,myKey);
  if(s.award_reveal){
    $("ava").innerHTML="";$("am").textContent="";
    renderPlayerAwardResult(s,i);
  }else{
    $("awardPlayerResult").classList.add("hidden");
    $("ava").innerHTML=Object.keys(s.players).map(n=>`<button class="ans ${voted&&s.votes[myKey]===n?"sel":""}" ${voted?"disabled":""} onclick='award(${JSON.stringify(n)})'>${n}</button>`).join("");
    $("am").textContent=voted?"투표 완료! 결과 공개를 기다려주세요.":"한 명을 선택해주세요.";
  }
 }else {lastAwardIndex=-1;final(s)}
}
function renderPlayerAwardResult(s,i){
 const counts={};Object.keys(s.players).forEach(()=>{});
 Object.entries(s.votes).forEach(([k,v])=>{if(k.startsWith(i+"|"))counts[v]=(counts[v]||0)+1});
 const arr=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
 const top=arr[0];
 $("awardPlayerResult").classList.remove("hidden");
 $("awardPlayerResult").innerHTML=top?`<div>🏆 이번 AWARDS 1위</div><div class="winner">${top[0]} · ${top[1]}표</div><p>${arr.slice(1,3).map((x,j)=>`${j+2}위 ${x[0]} · ${x[1]}표`).join("　")}</p>`:"<div>아직 투표 결과가 없습니다.</div>";
}

function adminRender(s){
 const e=Object.entries(s.players),now=Date.now()/1000,online=e.filter(([n,p])=>p.last_seen&&now-p.last_seen<4).length;
 const answered=e.filter(([n,p])=>p.answered).length;
 $("ast").textContent=s.phase;$("pc").textContent=e.length;$("liveCount").textContent=`온라인 ${online}/${e.length} · 응답 ${answered}/${e.length}`;
 $("players").innerHTML=e.map(([n])=>`<span class="pill">${n}</span>`).join("")||"없음";
 $("responses").innerHTML=e.filter(([n,p])=>p.answered).map(([n])=>`<span class="pill">${n} ✓</span>`).join("")||"아직 없음";
 $("scores").innerHTML=e.sort((a,b)=>b[1].score-a[1].score).map(([n,p],i)=>`<div class="row"><span>${i+1}. ${n}</span><b>${p.score}점</b></div>`).join("");
 $("monitor").innerHTML=e.map(([n,p])=>{
   const on=p.last_seen&&now-p.last_seen<4;
   let text=s.phase==="quiz"?`Q${s.q+1} · ${p.answered?"답변 완료":"미응답"}`:s.phase==="awards"?`AWARDS Q${s.award_q+1}`:s.phase==="final"?"최종 결과":"대기 화면";
   if(s.phase==="awards"){const v=Object.prototype.hasOwnProperty.call(s.votes,`${s.award_q}|${n}`);text+=s.award_reveal?" · 결과 공개":" · "+(v?"투표 완료":"투표 중")}
   const cls=on?(p.answered||s.phase!=="quiz"?"ok":"waitc"):"off";
   return `<div class="person"><b>${n}</b><span class="${cls}">${on?"●":"○"} ${on?text:"접속 확인 필요"}</span></div>`;
 }).join("")||'<div class="person">아직 참가자가 없습니다.</div>';

 if(s.phase==="quiz"){
  const q=qs[s.q];$("adminQ").textContent=q.text;
  $("preview").innerHTML=`<span class="badge">👀 현재 참가자 화면</span><div class="pvq">${q.text}</div><div class="pva">${q.answers.map((x,i)=>`<span>${["①","②","③","④"][i]} ${x}</span>`).join("")}</div><p><b>${answered}명</b> 답변 완료 · <b>${e.length-answered}명</b> 미응답</p>`;
  $("ad").innerHTML=s.reveal?`<div class="detail"><b>정답: ${q.answers[q.correct]}</b><br>${q.detail}</div>`:"";
 }else if(s.phase==="awards"){
  const i=s.award_q, counts=getAwardCounts(s,i),arr=Object.entries(counts).sort((a,b)=>b[1]-a[1]),v=e.filter(([n])=>Object.prototype.hasOwnProperty.call(s.votes,`${i}|${n}`)).length;
  $("adminQ").textContent="💕 "+aws[i];
  $("preview").innerHTML=`<span class="badge">👀 현재 참가자 화면</span><div class="pvq">${aws[i]}</div><p><b>${v}명</b> 투표 완료 · <b>${e.length-v}명</b> 미투표</p>`;
  $("ad").innerHTML=s.award_reveal?renderAwardResultHTML(arr):"<div class='notice'>투표가 끝나면 <b>AWARDS 결과 공개</b>를 눌러 1위 결과를 참가자 화면에도 보여주세요.</div>";
 }else{$("adminQ").textContent=s.phase==="final"?"최종 결과":"게임 시작 전";$("preview").innerHTML=`<span class="badge">👀 참가자 화면</span><p>${s.phase==="lobby"?"대기 화면":"최종 결과 화면"}</p>`;$("ad").textContent=""}
 $("start").disabled=s.phase!=="lobby";$("rev").disabled=!(s.phase==="quiz"&&!s.reveal);$("next").disabled=!(s.phase==="quiz"&&s.reveal);
 $("arev").disabled=!(s.phase==="awards"&&!s.award_reveal);$("anext").disabled=!(s.phase==="awards"&&s.award_reveal);
 renderAwardSummary(s);
}
function getAwardCounts(s,i){const c={};Object.entries(s.votes).forEach(([k,v])=>{if(k.startsWith(i+"|"))c[v]=(c[v]||0)+1});return c}
function renderAwardResultHTML(arr){
 if(!arr.length)return "<div class='resultbox'>아직 투표 결과가 없습니다.</div>";
 const max=arr[0][1];
 return `<div class="resultbox"><div>🏆 <b>이번 AWARDS 결과</b></div><div class="winner">${arr[0][0]} · ${max}표</div>${arr.slice(1).map((x,i)=>`<div class="row"><span>${i+2}위 · ${x[0]}</span><b>${x[1]}표</b></div>`).join("")}</div>`;
}
function renderAwardSummary(s){
 if(s.phase==="awards"){let arr=Object.entries(getAwardCounts(s,s.award_q)).sort((a,b)=>b[1]-a[1]);$("ar").innerHTML=arr.length?renderAwardResultHTML(arr):"아직 투표 없음";
 }else $("ar").innerHTML="";
}

async function finalAdmin(){
  await api("/api/admin/final","POST");
  let s=await api("/api/state");
  let r=await api("/api/admin/award-results");
  finalHTML(s,r);
}

async function final(s){
  let r=await api("/api/admin/award-results");
  finalHTML(s,r);
}

function finalHTML(s,r){

  // QUIZ 점수 순위
  let arr = Object.entries(s.players)
    .sort((a,b)=>
      Number(b[1]?.score ?? 0) - Number(a[1]?.score ?? 0)
    );

  $("rank").innerHTML = arr.map((x,i)=>{
    const score = Number(x[1]?.score ?? 0);
    return `
      <h2>
        ${["🥇","🥈","🥉"][i] || "🏅"}
        ${x[0]} — ${score}점
      </h2>
    `;
  }).join("");

  // AWARDS 결과
  $("fr").innerHTML = r.results.map((c,i)=>{

    let a = Object.entries(c)
      .sort((x,y)=>Number(y[1]) - Number(x[1]))[0];

    return a
      ? `<p>Q${i+1} · 🏆 ${a[0]} (${Number(a[1])}표)</p>`
      : "";
      
  }).join("");

  show("final");
}
async function reset(){if(!confirm("참가자와 점수, 투표 결과를 모두 초기화할까요?"))return;try{await api("/api/admin/reset","POST");qs=(await api("/api/questions")).questions;aws=(await api("/api/questions")).awards;renderEditors()}catch(e){alert(e.message)}}
function home(){
  me="";
  show("home");
}
async function poll(){try{if(me)await api("/api/heartbeat","POST",{name:me});let s=await api("/api/state");if(!$("admin").classList.contains("hidden"))adminRender(s);else player(s)}catch(e){}}
init();setInterval(poll,700);
</script></body></html>
